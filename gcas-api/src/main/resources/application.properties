spring.application.name=gcas-api

server.port=8080

# Datasource — env vars override these when running in Docker (see docker-compose.yml).
# Falls back to H2 in-memory DB for local development without Docker.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:gcasdb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# H2 browser console only useful locally, harmless to leave on
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate DDL env var lets Docker override to 'update' (keep data between restarts)
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:create-drop}
spring.jpa.show-sql=true

# Engine binary path overridable via env var for different environments
engine.path=${ENGINE_PATH:/app/engine}
